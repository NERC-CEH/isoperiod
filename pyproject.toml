
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isoperiod"
version = "1.1.0"
description = "ISO 8601 period and duration arithmetic, including offsets from the natural boundary, for defining sampling resolution and periodicity in timeseries data"
readme = "README.md"
authors = [
  {name = "Richard Smith", email = "ricsmi@ceh.ac.uk"}
]
maintainers = [
  {name = "Richard Smith", email = "ricsmi@ceh.ac.uk"}
]
classifiers = [
"License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
license = { file = "LICENSE" }
dependencies = []
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "docs" },

]
lint = [
    "ruff",
]
test = [
    "coverage",
    "polars>=1.44.1",
    "pytest",
    "pytest-cov",
]
typecheck = [
    "pyright",
]
docs = [
    "sphinx",
    "shibuya>=2025.9.25",
    "sphinx-copybutton",
    "sphinx-design>=0.6.1",
    "sphinx-iconify>=0.2.1",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
    "sphinx-contributors>=0.2.7",
    "myst-parser",
    "jupyter-sphinx>=0.5.3",
    "polars>=1.44.1",
]


[project.urls]
bugs = "https://github.com/NERC-CEH/isoperiod/issues"
changelog = "https://github.com/NERC-CEH/isoperiod/releases"
documentation = "https://nerc-ceh.github.io/isoperiod/"
homepage = "https://github.com/NERC-CEH/isoperiod"


[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "docs/source/examples"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "except PackageNotFoundError",
    "if __name__ == .__main__.",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
# "src" is here so that --doctest-modules collects the ">>>" examples in the docstrings, which are
# rendered into the API reference. The user guide's examples live in docs/source/examples and are run by
# tests/isoperiod/test_examples.py.
testpaths = ["tests", "src"]
addopts = "--import-mode=importlib --cov=src --cov-report=term-missing --doctest-modules"

[tool.uv]
package = true
default-groups = ["dev"]
